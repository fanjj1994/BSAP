# 规划配置

vehicle:
  ego_car:
    id: 0
    frame: "base_footprint"
    length: 3.0
    width: 1.5
    pose_x: 0.0
    pose_y: 0.0
    pose_theta: 0.0
    set_speed: 1.0
  tp_car1:
    id: 1
    frame: "base_footprint_tp1"
    length: 3.0
    width: 1.6
    pose_x: 60.0
    pose_y: 0.0
    pose_theta: 0.0
    set_speed: 0.0
  tp_car2:
    id: 2
    frame: "base_footprint_tp2"
    length: 3.0
    width: 1.6
    pose_x: 120.0
    pose_y: 17.0
    pose_theta: 1.0
    set_speed: 0.0
  tp_car3:
    id: 3
    frame: "base_footprint_tp3"
    length: 3.0
    width: 1.6
    pose_x: 85.0
    pose_y: 4.0
    pose_theta: 0.0
    set_speed: 0.0

pnc_map:
  frame: "world"
  type: 0
  road_length: 200.0
  road_half_width: 3.5   # unit: m
  segment_len: 1.0       # unit: m
  lane_width: 3.5        # unit: m，两车道均分，与 road_half_width 同改

global_path:
  type: 0

reference_line:
  front_size: 80
  back_size: 20

planning_process:
  cycle_time: 0.1        # unit: s
  perception_range: 100.0

decision:
  lat_safe_margin: 0.5   # unit: m
  long_safe_margin: 10.0 # unit: m

local_path:
  path_size: 100         # QP 网格点数
  interval: 0.5          # unit: m
  weight_smooth: 100.0   # w1
  weight_slope: 10.0     # w2
  weight_offset: 1.0     # w3
